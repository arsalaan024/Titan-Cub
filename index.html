<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titan Club | Official Campus Portal</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            maroon: {
              50: '#fdf2f2',
              100: '#fde8e8',
              200: '#fbd5d5',
              300: '#f8b4b4',
              400: '#f98080',
              500: '#ee4242',
              600: '#c81e1e',
              700: '#9b1c1c',
              800: '#800000',
              900: '#771d1d'
            },
            "on-primary-fixed": "#000000",
            "on-secondary-container": "#343d96",
            "surface-container-low": "#ffedeb",
            "on-secondary": "#f3f1ff",
            "on-tertiary-fixed-variant": "#006b63",
            "surface-tint": "#a63300",
            "primary-fixed-dim": "#f7652f",
            "error-container": "#fb5151",
            "tertiary-fixed": "#77feee",
            "tertiary-container": "#77feee",
            "tertiary-dim": "#005a53",
            "error-dim": "#9f0519",
            "surface-container-highest": "#ffd2ce",
            "secondary-dim": "#3d469f",
            "error": "#b31b25",
            "background": "#fff4f3",
            "on-tertiary": "#bffff5",
            "on-tertiary-fixed": "#004c45",
            "surface-container": "#ffe2df",
            "outline-variant": "#e09c96",
            "secondary": "#4953ac",
            "primary-dim": "#922c00",
            "surface-container-high": "#ffdad7",
            "tertiary": "#00675f",
            "primary": "#a63300",
            "outline": "#a36762",
            "on-error": "#ffefee",
            "tertiary-fixed-dim": "#67efe0",
            "surface-container-lowest": "#ffffff",
            "on-tertiary-container": "#006058",
            "surface-variant": "#ffd2ce",
            "secondary-container": "#cbceff",
            "on-surface": "#4e211e",
            "primary-fixed": "#ff7949",
            "secondary-fixed-dim": "#babfff",
            "on-error-container": "#570008",
            "secondary-fixed": "#cbceff",
            "on-primary": "#ffefeb",
            "on-background": "#4e211e",
            "inverse-primary": "#fe6a34",
            "surface-dim": "#ffc7c2",
            "inverse-surface": "#240303",
            "surface": "#fff4f3",
            "surface-bright": "#fff4f3",
            "on-secondary-fixed-variant": "#3e47a0",
            "on-primary-container": "#451000",
            "inverse-on-surface": "#ce8c87",
            "on-secondary-fixed": "#1f2882",
            "on-primary-fixed-variant": "#551600",
            "primary-container": "#ff7949",
            "on-surface-variant": "#834c48"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Be Vietnam Pro"],
            "label": ["Be Vietnam Pro"],
            'sans': ['Inter', 'ui-sans-serif', 'system-ui'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out forwards',
            'slide-up': 'slideUp 0.6s ease-out forwards',
            'ribbon-swing': 'swing 4s ease-in-out infinite',
            'pull-ribbon': 'pull 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(30px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            swing: {
              '0%, 100%': { transform: 'rotate(-0.8deg)' },
              '50%': { transform: 'rotate(0.8deg)' },
            },
            pull: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(50px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .kinetic-gradient {
      background: linear-gradient(135deg, #a63300 0%, #ff7949 100%);
    }

    body {
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
      background-color: #fcfcfc;
    }

    .scroll-hide::-webkit-scrollbar {
      display: none;
    }

    .scroll-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .ribbon-gradient {
      background: linear-gradient(180deg, #800000 0%, #600000 100%);
      box-shadow: inset -5px 0 10px rgba(0, 0, 0, 0.2);
    }

    .dark-ribbon-gradient {
      background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
      box-shadow: inset -5px 0 10px rgba(255, 255, 255, 0.05);
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-gray-50 text-gray-900 selection:bg-maroon-100 selection:text-maroon-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
